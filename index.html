<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Mock Test Platform</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
<h1>Mock Test Platform</h1>
<p>Practice mock tests and track your performance</p>
</header>

<main>

<!-- START SCREEN -->
<section id="start-screen">
<h2>Practice Test</h2>

<div class="test-info">
<p>Total Questions: <span id="total-questions"></span></p>
<p>Time Limit: <span id="time-limit"></span></p>
</div>

<button id="start-btn">Start Test</button>
</section>


<!-- EXAM SCREEN -->
<section id="exam-screen" class="hidden">

<div class="exam-header">

<div id="progress">
Question <span id="current-q"></span> / <span id="total-q"></span>
</div>

<!-- <div id="timer">
Time: <span id="time-remaining">00:00</span>
</div> -->

</div>

<div id="question-container"></div>

<div id="options-container"></div>

<div class="navigation">

<button id="prev-btn">Previous</button>
<button id="next-btn">Next</button>
<button id="submit-btn">Submit</button>

</div>

</section>


<!-- RESULT SCREEN -->
<section id="result-screen" class="hidden">

<h2>Test Result</h2>

<p>Your Score:</p>
<h3 id="score-display"></h3>

<button id="restart-btn">Take Another Test</button>

</section>

</main>

<script src="js/questions.js"></script>
<script src="js/ui.js"></script>
<script src="js/timer.js"></script>
<script src="js/exam.js"></script>

</body>
</html>
